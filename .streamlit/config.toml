primaryColor = "#2563eb"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f1f5f9"
textColor = "#0f172a"
font = "Plus Jakarta Sans, sans-serif"

[[theme.fontFaces]]
family = "Plus Jakarta Sans"
url = "app/static/PlusJakartaSans.woff2"
