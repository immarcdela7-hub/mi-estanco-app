# Proxy inverso para crm.notaxlost.com → app CRM (Docker, 127.0.0.1:8090)
# Colocar en /etc/nginx/sites-available/crm.notaxlost.com y enlazar en sites-enabled.
# Certbot añadirá el bloque 443 y la redirección automáticamente.

# Límite de peticiones al login para frenar fuerza bruta por IP.
# (Debe ir en el contexto http; nginx lo permite aquí porque el archivo se
#  incluye desde el http principal.)
limit_req_zone $binary_remote_addr zone=crm_login:10m rate=10r/m;

# La API pública (/api/publico/…) la llama el navegador de cada visitante de
# notaxlost.com, así que va abierta. El límite es la primera barrera; la app
# vuelve a limitar por IP y valida todo lo que entra.
limit_req_zone $binary_remote_addr zone=crm_publico:10m rate=60r/m;

server {
    listen 80;
    listen [::]:80;
    server_name crm.notaxlost.com;

    # Límite de subida (para importaciones CSV y descargas de carteles)
    client_max_body_size 25m;

    # Endurece el login: máx. ~10 intentos/min por IP, con margen de ráfaga.
    location = /login {
        limit_req zone=crm_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/publico/ {
        limit_req zone=crm_publico burst=30 nodelay;
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 300s;
    }
}
