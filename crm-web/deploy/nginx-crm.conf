# Proxy inverso para crm.notaxlost.com → app CRM (Docker, 127.0.0.1:8090)
# Colocar en /etc/nginx/sites-available/crm.notaxlost.com y enlazar en sites-enabled.
# Certbot añadirá el bloque 443 y la redirección automáticamente.

server {
    listen 80;
    listen [::]:80;
    server_name crm.notaxlost.com;

    # Límite de subida (para importaciones CSV y descargas de carteles)
    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 300s;
    }
}
