# Proxy inverso para crm.notaxlost.com → app CRM (Docker, 127.0.0.1:8090)
# Colocar en /etc/apache2/sites-available/crm.notaxlost.com.conf y activar con a2ensite.
# Requiere: a2enmod proxy proxy_http headers
# Certbot añadirá el VirtualHost 443 y la redirección automáticamente.

<VirtualHost *:80>
    ServerName crm.notaxlost.com

    ProxyPreserveHost On
    ProxyRequests Off

    RequestHeader set X-Forwarded-Proto "http"

    ProxyPass        / http://127.0.0.1:8090/
    ProxyPassReverse / http://127.0.0.1:8090/

    ProxyTimeout 300

    ErrorLog  ${APACHE_LOG_DIR}/crm_error.log
    CustomLog ${APACHE_LOG_DIR}/crm_access.log combined
</VirtualHost>
