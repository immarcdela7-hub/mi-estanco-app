services:
  db:
    image: postgres:16-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-crm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?define POSTGRES_PASSWORD en .env}
      POSTGRES_DB: ${POSTGRES_DB:-crm}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-crm} -d ${POSTGRES_DB:-crm}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - internal

  # Aplica las migraciones una vez (node_modules completo) y termina.
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrator
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-crm}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-crm}
    restart: "no"
    networks:
      - internal

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-crm}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-crm}
      AUTH_SECRET: ${AUTH_SECRET:?define AUTH_SECRET en .env}
      NODE_ENV: production
    # Solo accesible desde el propio servidor; el proxy inverso (nginx/apache) lo publica.
    ports:
      - "127.0.0.1:${APP_PORT:-8090}:3000"
    networks:
      - internal

  backup:
    image: postgres:16-bookworm
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGUSER: ${POSTGRES_USER:-crm}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:-crm}
      PGHOST: db
      RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
    volumes:
      - ./backups:/backups
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "Servicio de copias de seguridad activo (diarias, retención $${RETENTION_DAYS} días)."
        while true; do
          ts=$$(date +%Y%m%d_%H%M%S)
          out="/backups/crm_$${ts}.sql.gz"
          if pg_dump --no-owner | gzip > "$${out}"; then
            echo "$$(date -Iseconds) copia creada: $${out}"
          else
            echo "$$(date -Iseconds) ERROR al crear la copia"
            rm -f "$${out}"
          fi
          find /backups -name 'crm_*.sql.gz' -mtime +$${RETENTION_DAYS} -delete
          sleep 86400
        done
    networks:
      - internal

volumes:
  db_data:

networks:
  internal:
