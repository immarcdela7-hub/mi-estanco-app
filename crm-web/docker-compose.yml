services:
  db:
    image: postgres:16-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-crm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?define POSTGRES_PASSWORD en .env}
      POSTGRES_DB: ${POSTGRES_DB:-crm}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-crm} -d ${POSTGRES_DB:-crm}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - internal

  # Aplica las migraciones una vez (node_modules completo) y termina.
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrator
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-crm}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-crm}
    restart: "no"
    networks:
      - internal

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-crm}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-crm}
      AUTH_SECRET: ${AUTH_SECRET:?define AUTH_SECRET en .env}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-}
      # Origenes extra desde los que se aceptan reservas de actividades
      # propias, separados por comas. El de la web ya sale de la URL base de
      # los QR; esto es solo para pruebas o dominios adicionales.
      PUBLIC_WEB_ORIGINS: ${PUBLIC_WEB_ORIGINS:-}
      # Donde se guardan los PDF de las facturas. Es un montaje del host, no
      # un volumen opaco: son papeles que hay que conservar años y que el
      # gestor puede necesitar copiar en cualquier momento.
      FACTURAS_DIR: /data/facturas
      NODE_ENV: production
    volumes:
      - ./facturas:/data/facturas
    # Solo accesible desde el propio servidor; el proxy inverso (nginx/apache) lo publica.
    ports:
      - "127.0.0.1:${APP_PORT:-8090}:3000"
    networks:
      - internal

  backup:
    image: postgres:16-bookworm
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGUSER: ${POSTGRES_USER:-crm}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:-crm}
      PGHOST: db
      RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
    volumes:
      - ./backups:/backups
      # Solo lectura: este servicio copia, no toca.
      - ./facturas:/facturas:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        umask 077
        echo "Servicio de copias de seguridad activo (diarias, retención $${RETENTION_DAYS} días)."
        while true; do
          ts=$$(date +%Y%m%d_%H%M%S)
          out="/backups/crm_$${ts}.sql.gz"
          if pg_dump --no-owner | gzip > "$${out}"; then
            echo "$$(date -Iseconds) copia creada: $${out}"
          else
            echo "$$(date -Iseconds) ERROR al crear la copia"
            rm -f "$${out}"
          fi
          # Las facturas viven en disco, no en la base de datos: un pg_dump
          # solo se lleva sus fichas. Sin esto, restaurar una copia dejaria el
          # archivo lleno de enlaces a PDF que ya no estan.
          fac="/backups/facturas_$${ts}.tar.gz"
          if tar -czf "$${fac}" -C /facturas . 2>/dev/null; then
            echo "$$(date -Iseconds) facturas copiadas: $${fac}"
          else
            echo "$$(date -Iseconds) ERROR al copiar las facturas"
            rm -f "$${fac}"
          fi
          find /backups -name 'crm_*.sql.gz' -mtime +$${RETENTION_DAYS} -delete
          find /backups -name 'facturas_*.tar.gz' -mtime +$${RETENTION_DAYS} -delete
          sleep 86400
        done
    networks:
      - internal

volumes:
  db_data:

networks:
  internal:
