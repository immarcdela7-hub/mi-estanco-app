<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <meta name="theme-color" content="#002B5B">
    <title>Catalunya Experiences: Barcelona, Costa Daurada &amp; more | NoTaxLost</title>
    <meta name="description" content="Book the best experiences across Catalunya — Barcelona, Salou and the Costa Daurada: Sagrada Familia, Park Güell, boat trips, PortAventura, flamenco, nightlife and 100+ tours. Skip-the-line tickets, instant mobile vouchers and free cancellation.">
    <link rel="canonical" href="https://notaxlost.com/tickets">
    <meta name="robots" content="index, follow">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Catalunya Experiences | NoTaxLost">
    <meta property="og:description" content="100+ top experiences across Catalunya — skip-the-line tickets, tours, nightlife and activities with instant mobile booking.">
    <meta property="og:url" content="https://notaxlost.com/tickets">
    <meta property="og:image" content="https://notaxlost.com/images/sagrada_familia.png">
    <meta name="twitter:card" content="summary_large_image">
    <link rel="stylesheet" href="/css/app.css">
    <style>
        /* Smooth hiding/showing for the filter */
        .experience-item { transition: opacity 0.3s ease; }
        
        /* View Toggle Logic */
        .view-grid {
            display: grid;
            grid-template-columns: repeat(1, minmax(0, 1fr));
            gap: 1.5rem;
        }
        @media (min-width: 640px) { .view-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
        @media (min-width: 768px) { .view-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
        
        .view-grid .item-wrapper { flex-direction: column; height: 100%; }
        .view-grid .item-image { height: 11rem; width: 100%; border-bottom-left-radius: 0; border-bottom-right-radius: 0; }
        .view-grid .item-content { padding: 1.25rem; flex-grow: 1; display: flex; flex-direction: column; }
        .view-grid .item-footer { margin-top: auto; }
        
        /* 2-Column List View Updates */
        .view-list {
            display: grid;
            grid-template-columns: repeat(1, minmax(0, 1fr));
            gap: 0.75rem;
        }
        @media (min-width: 768px) { .view-list { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
        
        .view-list .item-wrapper { flex-direction: row; align-items: center; }
        .view-list .item-image { height: 5rem; width: 5rem; border-radius: 0.75rem; margin: 0.5rem; }
        .view-list .item-content { padding: 0.5rem 1rem 0.5rem 0.5rem; flex-grow: 1; display: flex; flex-direction: row; align-items: center; justify-content: space-between; }
        .view-list .text-content { flex-grow: 1; padding-right: 1rem; }
        .view-list .item-description { display: none; }
        .view-list .item-footer { border-top: none; padding-top: 0; margin-top: 0; display: flex; align-items: center; justify-content: flex-end; }
        .view-list .footer-tag { display: none; } 
        .view-list .price-tag { display: block !important; margin-right: 0.75rem; font-weight: bold; color: #374151; font-size: 0.85rem;}
        .view-list .book-btn { width: auto; padding-left: 1rem; padding-right: 1rem; padding-top: 0.35rem; padding-bottom: 0.35rem; font-size: 0.7rem; }
        .view-list .category-tag { font-size: 9px; margin-bottom: 2px; }
        .view-list h3 { font-size: 0.85rem; margin-bottom: 0; }

        /* Full-width, centered filter bars (province + categories).
           Plain CSS on purpose: app.css is a purged Tailwind build and may not
           ship justify-center / flex-wrap. Centered on desktop, scrollable on mobile. */
        .ntl-filterbar { display: flex; flex-wrap: wrap; justify-content: center; gap: 0.5rem; }
        @media (max-width: 640px) {
            .ntl-filterbar { flex-wrap: nowrap; overflow-x: auto; justify-content: flex-start; -ms-overflow-style: none; scrollbar-width: none; }
            .ntl-filterbar::-webkit-scrollbar { display: none; }
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-900 font-sans antialiased pb-20">

    <!-- Sticky Header -->
    <header class="bg-white w-full flex justify-between items-center py-4 px-6 border-b border-gray-100 sticky top-0 z-50 shadow-sm">
        <div class="flex items-center gap-4">
            <a href="/" class="flex items-center justify-center w-8 h-8 bg-gray-50 rounded-full text-gray-500 hover:bg-gray-200 transition" title="Back to main site">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
            </a>

    <!-- Hero Section -->

        <!-- Abstract shapes -->
        <div class="absolute top-0 right-0 w-full h-full bg-gradient-to-b from-blue-900/50 to-transparent z-0"></div>
        <div class="absolute -top-20 -right-20 w-72 h-72 bg-gradient-to-br from-ntl-accent to-ntl-vibrant rounded-full blur-3xl opacity-40 mix-blend-screen"></div>
        <div class="absolute -bottom-10 -left-10 w-48 h-48 bg-white rounded-full blur-2xl opacity-10"></div>
        
        <div class="relative z-10 max-w-xl mx-auto">

                <svg class="w-4 h-4 text-ntl-vibrant" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                Catalunya

            <h1 class="text-4xl md:text-5xl font-extrabold mb-4 leading-tight tracking-tight">Catalunya's best,<br><span class="text-ntl-green">in one scan.</span></h1>
            
            <!-- Live Search Bar -->
            <div class="mt-8 relative max-w-sm mx-auto">

                    <svg class="h-5 w-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                </div>
                <input type="text" id="searchInput" placeholder="Search for Sagrada, Boat, Tour..." class="w-full bg-white text-gray-900 rounded-full py-3.5 pl-12 pr-4 shadow-lg focus:outline-none focus:ring-2 focus:ring-ntl-vibrant transition placeholder-gray-400 font-medium text-sm">

    <!-- Province Filter (top-level geography, full width, centered) -->

            <button class="province-btn bg-white text-gray-600 px-5 py-2.5 rounded-full text-sm font-bold shadow-md whitespace-nowrap hover:bg-gray-50 transition" data-province="lleida">Lleida</button>

    <!-- Filter Categories (full width, centered) -->

        <div class="ntl-filterbar pb-2" id="filterContainer">
            <button class="filter-btn active inline-flex items-center gap-1.5 bg-ntl-navy text-white px-5 py-2.5 rounded-full text-sm font-bold shadow-md whitespace-nowrap snap-start transition" data-filter="all"><svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 3l2.09 6.26L20 11l-5.91 1.74L12 19l-2.09-6.26L4 11l5.91-1.74L12 3z"/></svg>All</button>

            <button class="filter-btn inline-flex items-center gap-1.5 bg-white text-gray-600 px-5 py-2.5 rounded-full text-sm font-bold shadow-md whitespace-nowrap snap-start hover:bg-gray-50 transition" data-filter="sea"><svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 14c1.5 0 2.2-1 3.5-1s2 1 3.5 1 2.2-1 3.5-1 2 1 3.5 1 2.2-1 3.5-1M3 19c1.5 0 2.2-1 3.5-1s2 1 3.5 1 2.2-1 3.5-1 2 1 3.5 1 2.2-1 3.5-1M12 3v7"/></svg>Sea &amp; Adventure</button>
            <button class="filter-btn inline-flex items-center gap-1.5 bg-white text-gray-600 px-5 py-2.5 rounded-full text-sm font-bold shadow-md whitespace-nowrap snap-start hover:bg-gray-50 transition" data-filter="tours"><svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 20l-5-2.5V5l5 2.5m0 12.5l6-3m-6 3V7.5m6 9.5l5 2.5V9l-5-2.5m0 12.5V7.5m0 0L9 5"/></svg>Tours &amp; Trips</button>
            <button class="filter-btn inline-flex items-center gap-1.5 bg-white text-gray-600 px-5 py-2.5 rounded-full text-sm font-bold shadow-md whitespace-nowrap snap-start hover:bg-gray-50 transition" data-filter="food"><svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M8 3h8l-1 8a3 3 0 01-6 0L8 3zM12 14v5M9 21h6"/></svg>Food &amp; Nightlife</button>
        </div>
    </section>

    <!-- Advanced Filters -->
    <section class="max-w-6xl mx-auto px-6 mb-8 flex items-center justify-between gap-4 flex-wrap">
        <div class="flex items-center gap-3 flex-wrap">
            <select id="priceFilter" class="bg-white border border-gray-200 text-gray-700 text-sm rounded-full px-4 py-2 shadow-sm focus:outline-none focus:ring-2 focus:ring-ntl-vibrant font-medium cursor-pointer">
                <option value="default">Sort by: Recommended</option>
                <option value="low">Price: Low to High</option>
                <option value="high">Price: High to Low</option>

            <button id="topRatedFilter" class="bg-white border border-gray-200 text-gray-700 text-sm rounded-full px-4 py-2 shadow-sm focus:outline-none font-medium hover:bg-gray-50 transition cursor-pointer flex items-center gap-1.5">
                <svg class="w-4 h-4 text-yellow-400" fill="currentColor" viewBox="0 0 20 20"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.286 3.958a1 1 0 00.95.69h4.162c.969 0 1.371 1.24.588 1.81l-3.37 2.448a1 1 0 00-.363 1.118l1.287 3.958c.3.921-.771 1.688-1.54 1.118l-3.37-2.448a1 1 0 00-1.175 0l-3.37 2.448c-.768.57-1.838-.197-1.539-1.118l1.286-3.958a1 1 0 00-.362-1.118L2.02 9.383c-.784-.57-.38-1.81.588-1.81h4.163a1 1 0 00.95-.69l1.286-3.958z"/></svg>
                Top Rated
            </button>
        </div>
    </section>

    <!-- Dynamic Container -->
    <div class="px-6 max-w-6xl mx-auto mb-10">
        
        <!-- View Controls -->
        <div class="flex items-center justify-between mb-4">
            <h2 class="text-xl font-extrabold text-gray-900">All Experiences</h2>
            <div class="flex bg-gray-200 p-1 rounded-lg">
                <button id="btnGrid" class="p-1.5 rounded-md bg-white shadow-sm text-ntl-navy transition" title="Grid View">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"></path></svg>

        <div id="experiencesContainer" class="view-grid"></div>

        <!-- Empty State Message -->
        <div id="emptyState" class="hidden text-center py-12">

    <!-- GetYourGuide Discover More Section -->
    <section class="py-8 px-4 max-w-lg mx-auto relative mt-8">
        <div class="bg-white p-4 rounded-3xl shadow-xl border border-gray-100">
            <div class="mb-5 flex items-center justify-between px-2">
                <h2 class="text-lg font-extrabold text-gray-900">Discover More</h2>
                <div class="flex items-center gap-1 text-[10px] text-gray-400 font-bold uppercase">
                    Powered by GYG
                </div>
            </div>
            <!-- GYG City Widget -->
            <div data-gyg-href="https://widget.getyourguide.com/default/city.frame" data-gyg-location-id="45" data-gyg-locale-code="en-US" data-gyg-widget="city" data-gyg-partner-id="IBO5PAK"></div>
        </div>
    </section>

    <!-- Trust Badges -->
    <section class="py-6 px-6 text-center text-xs text-gray-400">
        <div class="flex justify-center gap-4 opacity-80 font-medium">
            <span>24/7 Support</span>
            <span>•</span>
            <span>Free Cancellation</span>
            <span>•</span>
            <span>Mobile Tickets</span>
        </div>
    </section>

    <!-- GYG Script (Loaded only once) -->
    <script async defer src="https://widget.getyourguide.com/dist/pa.umd.production.min.js" data-gyg-partner-id="IBO5PAK"></script>
    
    <!-- Catalog data (generated from catalog.csv by tools/build-catalog.mjs) -->
    <script src="/catalog.js"></script>

    <!-- Render, Filtering & View Toggle Logic -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const container = document.getElementById('experiencesContainer');
            const emptyState = document.getElementById('emptyState');
            const searchInput = document.getElementById('searchInput');
            const filterButtons = document.querySelectorAll('.filter-btn');
            const provinceButtons = document.querySelectorAll('.province-btn');
            const priceFilter = document.getElementById('priceFilter');
            const topRatedFilter = document.getElementById('topRatedFilter');
            const btnGrid = document.getElementById('btnGrid');
            const btnList = document.getElementById('btnList');

            // ---------- RENDER CARDS FROM DATA (catalog.js -> window.NTL_CATALOG) ----------
            const STAR = '<svg class="inline-block w-3 h-3 -mt-0.5 text-yellow-400" fill="currentColor" viewBox="0 0 20 20"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.286 3.958a1 1 0 00.95.69h4.162c.969 0 1.371 1.24.588 1.81l-3.37 2.448a1 1 0 00-.363 1.118l1.287 3.958c.3.921-.771 1.688-1.54 1.118l-3.37-2.448a1 1 0 00-1.175 0l-3.37 2.448c-.768.57-1.838-.197-1.539-1.118l1.286-3.958a1 1 0 00-.362-1.118L2.02 9.383c-.784-.57-.38-1.81.588-1.81h4.163a1 1 0 00.95-.69l1.286-3.958z"/></svg>';
            const esc = (s) => String(s == null ? '' : s)
                .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');

            function cardHtml(a) {
                const trending = a.trending
                    ? '<div class="absolute top-2 right-2 bg-yellow-400 text-yellow-900 px-2 py-1 rounded-md text-[10px] font-bold uppercase shadow-sm">Trending</div>'
                    : '';
                return `
            <a href="${esc(a.url)}" class="experience-item group bg-white rounded-2xl shadow-sm hover:shadow-xl transition border border-gray-100 overflow-hidden" data-province="${esc(a.provincia)}" data-city="${esc(a.city)}" data-category="${esc(a.categoria)}" data-name="${esc(a.keywords)}" data-price="${esc(a.precio)}" data-rating="${esc(a.rating)}" data-order="${esc(a.order)}">
                <div class="item-wrapper flex">
                    <div class="item-image relative overflow-hidden shrink-0">
                        <img src="${esc(a.imagen)}" alt="${esc(a.titulo)}" loading="lazy" class="w-full h-full object-cover group-hover:scale-105 transition duration-500">
                        ${a.rating ? `<div class="absolute top-2 left-2 bg-white/90 px-2 py-1 rounded-md text-[10px] font-bold shadow-sm">${STAR} ${esc(a.rating)}</div>` : ''}
                        ${trending}
                    </div>
                    <div class="item-content">
                        <div class="text-content">
                            <div class="category-tag text-[10px] font-bold text-ntl-accent uppercase tracking-wider mb-1">${esc(a.categoriaLabel)}</div>
                            <h3 class="font-bold text-gray-900 mb-1 leading-tight line-clamp-2">${esc(a.titulo)}</h3>
                            <p class="item-description text-xs text-gray-500 mb-2 line-clamp-2">${esc(a.descripcion)}</p>
                        </div>
                        <div class="item-footer pt-3 border-t border-gray-50 flex items-center justify-between w-full">
                            <span class="footer-tag text-xs font-bold text-gray-400">${esc(a.etiquetaPie)}</span>
                            <div class="flex items-center">
                                <span class="price-tag text-sm font-bold text-gray-900 mr-3 hidden sm:block">${esc(a.precioDisplay)}</span>
                                <span class="book-btn bg-ntl-navy text-white text-xs font-bold px-4 py-2 rounded-full group-hover:bg-ntl-vibrant transition shadow-sm text-center">Book</span>
                            </div>
                        </div>
                    </div>
                </div>
            </a>`;
            }

            const CATALOG = Array.isArray(window.NTL_CATALOG) ? window.NTL_CATALOG : [];
            container.innerHTML = CATALOG.map(cardHtml).join('');

            // CRITICAL: re-run the QR attribution now that the GetYourGuide links exist,
            // otherwise cmp=EST-XXXXX is never added to the dynamically-rendered cards.
            if (typeof window.ntlApplyAttribution === 'function') window.ntlApplyAttribution();

            const experienceItems = Array.from(container.querySelectorAll('.experience-item'));

            // ---------- VIEW TOGGLE ----------
            function setGridView() {
                container.classList.remove('view-list');
                container.classList.add('view-grid');
                btnGrid.classList.add('bg-white', 'shadow-sm', 'text-ntl-navy');
                btnGrid.classList.remove('text-gray-500', 'hover:text-gray-800');
                btnList.classList.remove('bg-white', 'shadow-sm', 'text-ntl-navy');
                btnList.classList.add('text-gray-500', 'hover:text-gray-800');
            }
            function setListView() {
                container.classList.remove('view-grid');
                container.classList.add('view-list');
                btnList.classList.add('bg-white', 'shadow-sm', 'text-ntl-navy');
                btnList.classList.remove('text-gray-500', 'hover:text-gray-800');
                btnGrid.classList.remove('bg-white', 'shadow-sm', 'text-ntl-navy');
                btnGrid.classList.add('text-gray-500', 'hover:text-gray-800');
            }
            btnGrid.addEventListener('click', setGridView);
            btnList.addEventListener('click', setListView);

            // ---------- FILTER + SORT ----------
            let isTopRatedActive = false;
            let activeProvince = 'all';
            let cityFilter = 'all'; // internal; only set by ?zona= deep-links (per-shop QR posters)

            const provRank = { barcelona: 0, tarragona: 1, girona: 2, lleida: 3 };
            const cityRank = { barcelona: 0, salou: 1, cambrils: 2 };

            function filterAndSortExperiences() {
                const searchTerm = searchInput.value.toLowerCase();
                const activeBtn = document.querySelector('.filter-btn.active');
                const activeCategory = activeBtn ? activeBtn.dataset.filter : 'all';
                const sortOrder = priceFilter.value;

                let visibleCount = 0;
                experienceItems.forEach(item => {
                    const matchesSearch = item.dataset.name.toLowerCase().includes(searchTerm);
                    const matchesCategory = activeCategory === 'all' || item.dataset.category === activeCategory;
                    const matchesProvince = activeProvince === 'all' || item.dataset.province === activeProvince;
                    const matchesCity = cityFilter === 'all'
                        || item.dataset.city === cityFilter
                        || (cityFilter === 'costadaurada' && (item.dataset.city === 'salou' || item.dataset.city === 'cambrils'));
                    const matchesRating = !isTopRatedActive || parseFloat(item.dataset.rating) >= 4.8;

                    if (matchesSearch && matchesCategory && matchesProvince && matchesCity && matchesRating) {
                        item.style.display = '';
                        visibleCount++;
                    } else {
                        item.style.display = 'none';
                    }
                });

                const sorted = experienceItems.slice().sort((a, b) => {
                    const priceA = parseFloat(a.dataset.price), priceB = parseFloat(b.dataset.price);
                    if (sortOrder === 'low') return priceA - priceB;
                    if (sortOrder === 'high') return priceB - priceA;
                    // default: group by province, then locality, then recommended order
                    const rpA = provRank[a.dataset.province] ?? 9, rpB = provRank[b.dataset.province] ?? 9;
                    if (rpA !== rpB) return rpA - rpB;
                    const rcA = cityRank[a.dataset.city] ?? 9, rcB = cityRank[b.dataset.city] ?? 9;
                    if (rcA !== rcB) return rcA - rcB;
                    return parseInt(a.dataset.order) - parseInt(b.dataset.order);
                });
                sorted.forEach(item => container.appendChild(item));

                emptyState.classList.toggle('hidden', visibleCount !== 0);
            }

            // ---------- LISTENERS ----------
            topRatedFilter.addEventListener('click', () => {
                isTopRatedActive = !isTopRatedActive;
                if (isTopRatedActive) {
                    topRatedFilter.classList.add('bg-ntl-vibrant', 'text-white', 'border-ntl-vibrant');
                    topRatedFilter.classList.remove('bg-white', 'text-gray-700', 'border-gray-200');
                } else {
                    topRatedFilter.classList.remove('bg-ntl-vibrant', 'text-white', 'border-ntl-vibrant');
                    topRatedFilter.classList.add('bg-white', 'text-gray-700', 'border-gray-200');
                }
                filterAndSortExperiences();
            });
            priceFilter.addEventListener('change', filterAndSortExperiences);
            searchInput.addEventListener('input', filterAndSortExperiences);

            filterButtons.forEach(btn => {
                btn.addEventListener('click', () => {
                    filterButtons.forEach(b => {
                        b.classList.remove('active', 'bg-ntl-navy', 'text-white');
                        b.classList.add('bg-white', 'text-gray-600');
                    });
                    btn.classList.add('active', 'bg-ntl-navy', 'text-white');
                    btn.classList.remove('bg-white', 'text-gray-600');
                    filterAndSortExperiences();
                });
            });

            function activateProvinceButton(province) {
                provinceButtons.forEach(b => {
                    const on = b.dataset.province === province;
                    b.classList.toggle('active', on);
                    b.classList.toggle('bg-ntl-navy', on);
                    b.classList.toggle('text-white', on);
                    b.classList.toggle('bg-white', !on);
                    b.classList.toggle('text-gray-600', !on);
                });
            }
            provinceButtons.forEach(btn => {
                btn.addEventListener('click', () => {
                    activeProvince = btn.dataset.province;
                    cityFilter = 'all'; // choosing a province clears any city deep-link narrowing
                    activateProvinceButton(activeProvince);
                    filterAndSortExperiences();
                });
            });

            // ---------- DEEP-LINKS (per-shop QR posters): ?zona= / ?provincia= ----------
            const params = new URLSearchParams(location.search);
            const clean = (v) => (v || '').toLowerCase().replace(/[^a-z]/g, '');
            const zona = clean(params.get('zona') || params.get('zone'));
            const provParam = clean(params.get('provincia') || params.get('province'));
            const zoneToProvince = { barcelona: 'barcelona', salou: 'tarragona', cambrils: 'tarragona', costadaurada: 'tarragona', costadorada: 'tarragona', tarragona: 'tarragona', girona: 'girona', lleida: 'lleida' };
            const zoneToCity = { salou: 'salou', cambrils: 'cambrils', costadaurada: 'costadaurada', costadorada: 'costadaurada' };
            if (zona && zoneToProvince[zona]) {
                activeProvince = zoneToProvince[zona];
                cityFilter = zoneToCity[zona] || 'all';
                activateProvinceButton(activeProvince);
            } else if (provParam && zoneToProvince[provParam]) {
                activeProvince = zoneToProvince[provParam];
                activateProvinceButton(activeProvince);
            }

            filterAndSortExperiences();
        });

        // Store Tracking MVP
        window.onload = function () {
            const storeId = new URLSearchParams(window.location.search).get('store');
            if (storeId) { console.log('Welcome tourist from store:', storeId); }
        };
    </script>
  <!-- Cache-busting: sube el número de ?v=N cada vez que modifiques ntl-attrib.js
       para forzar a los navegadores a recargar el script (si no, sirven el cacheado). -->
  <script src="/ntl-attrib.js?v=2"></script>
